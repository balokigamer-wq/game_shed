name: Build Shifra APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Apply Game Code
        run: |
          flutter create shifra_app
          cp main.dart shifra_app/lib/main.dart

      - name: Build APK
        working-directory: ./shifra_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shifra-release-apk
          path: shifra_app/build/app/outputs/flutter-apk/app-release.apk
